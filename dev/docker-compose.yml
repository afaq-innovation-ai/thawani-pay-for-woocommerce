# Local development stack for Thawani Pay for WooCommerce.
# Usage: docker compose up -d   →  store http://localhost:8090 · mail http://localhost:8026
name: thawani-dev

services:
  db:
    image: mariadb:11
    container_name: thawani-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    container_name: thawani-wp
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "8090:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wp:/var/www/html
      - ../:/var/www/html/wp-content/plugins/thawani-pay-for-woocommerce
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins

  mailpit:
    image: axllent/mailpit:latest
    container_name: thawani-mail
    restart: unless-stopped
    ports:
      - "8026:8025"

  cli:
    image: wordpress:cli-php8.3
    container_name: thawani-cli
    depends_on: [wordpress]
    user: "33:33"
    entrypoint: ["sleep", "infinity"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ../:/var/www/html/wp-content/plugins/thawani-pay-for-woocommerce
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins

volumes:
  db:
  wp:
