name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: find . -path ./vendor -prune -o -path ./dev -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  standards-and-tests:
    name: Coding standards & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: WordPress Coding Standards
        run: composer lint
      - name: PHPUnit
        run: composer test
